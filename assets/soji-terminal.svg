<svg xmlns="http://www.w3.org/2000/svg" width="880" height="432" viewBox="0 0 880 432" font-family="'Courier New', ui-monospace, monospace">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rain"><rect x="14" y="48" width="196" height="366" rx="6"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0208" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#0D0208" stop-opacity="0"/>
      <stop offset="1" stop-color="#0D0208" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="878" height="430" rx="12" fill="#0D0208" stroke="#00FF41" stroke-opacity="0.55"/>
  <rect x="1" y="1" width="878" height="34" rx="12" fill="#06130A"/>
  <rect x="1" y="22" width="878" height="13" fill="#06130A"/>
  <circle cx="22" cy="18" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="18" r="6" fill="#FFBD2E"/>
  <circle cx="66" cy="18" r="6" fill="#27C93F"/>
  <text x="440" y="23" text-anchor="middle" fill="#00FF41" fill-opacity="0.7" font-size="13">soji@github: ~/profile</text>

  <!-- matrix rain (left) -->
  <g clip-path="url(#rain)" font-size="15" fill="#00FF41">
    <g opacity="0.85">
      <text x="26" y="0">1<tspan x="26" dy="22">0</tspan><tspan x="26" dy="22">1</tspan><tspan x="26" dy="22">1</tspan><tspan x="26" dy="22">0</tspan><tspan x="26" dy="22">#</tspan><tspan x="26" dy="22">1</tspan><tspan x="26" dy="22">0</tspan><tspan x="26" dy="22">0</tspan><tspan x="26" dy="22">1</tspan><tspan x="26" dy="22">$</tspan><tspan x="26" dy="22">0</tspan><tspan x="26" dy="22">1</tspan><tspan x="26" dy="22">1</tspan><tspan x="26" dy="22">0</tspan><tspan x="26" dy="22">1</tspan><tspan x="26" dy="22">0</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -180" to="0 180" dur="4.2s" repeatCount="indefinite"/>
      </text>
    </g>
    <g opacity="0.6">
      <text x="62" y="0">0<tspan x="62" dy="22">1</tspan><tspan x="62" dy="22">{</tspan><tspan x="62" dy="22">0</tspan><tspan x="62" dy="22">1</tspan><tspan x="62" dy="22">0</tspan><tspan x="62" dy="22">1</tspan><tspan x="62" dy="22">}</tspan><tspan x="62" dy="22">1</tspan><tspan x="62" dy="22">0</tspan><tspan x="62" dy="22">0</tspan><tspan x="62" dy="22">1</tspan><tspan x="62" dy="22">/</tspan><tspan x="62" dy="22">0</tspan><tspan x="62" dy="22">1</tspan><tspan x="62" dy="22">1</tspan><tspan x="62" dy="22">0</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -60" to="0 300" dur="5.6s" repeatCount="indefinite"/>
      </text>
    </g>
    <g opacity="0.75">
      <text x="98" y="0">1<tspan x="98" dy="22">1</tspan><tspan x="98" dy="22">0</tspan><tspan x="98" dy="22">&gt;</tspan><tspan x="98" dy="22">0</tspan><tspan x="98" dy="22">1</tspan><tspan x="98" dy="22">0</tspan><tspan x="98" dy="22">1</tspan><tspan x="98" dy="22">#</tspan><tspan x="98" dy="22">0</tspan><tspan x="98" dy="22">1</tspan><tspan x="98" dy="22">1</tspan><tspan x="98" dy="22">0</tspan><tspan x="98" dy="22">0</tspan><tspan x="98" dy="22">1</tspan><tspan x="98" dy="22">0</tspan><tspan x="98" dy="22">1</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -240" to="0 120" dur="3.6s" repeatCount="indefinite"/>
      </text>
    </g>
    <g opacity="0.5">
      <text x="134" y="0">0<tspan x="134" dy="22">0</tspan><tspan x="134" dy="22">1</tspan><tspan x="134" dy="22">0</tspan><tspan x="134" dy="22">$</tspan><tspan x="134" dy="22">1</tspan><tspan x="134" dy="22">0</tspan><tspan x="134" dy="22">1</tspan><tspan x="134" dy="22">1</tspan><tspan x="134" dy="22">0</tspan><tspan x="134" dy="22">*</tspan><tspan x="134" dy="22">1</tspan><tspan x="134" dy="22">0</tspan><tspan x="134" dy="22">1</tspan><tspan x="134" dy="22">0</tspan><tspan x="134" dy="22">0</tspan><tspan x="134" dy="22">1</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -120" to="0 240" dur="6.4s" repeatCount="indefinite"/>
      </text>
    </g>
    <g opacity="0.65">
      <text x="170" y="0">1<tspan x="170" dy="22">0</tspan><tspan x="170" dy="22">1</tspan><tspan x="170" dy="22">0</tspan><tspan x="170" dy="22">1</tspan><tspan x="170" dy="22">&lt;</tspan><tspan x="170" dy="22">0</tspan><tspan x="170" dy="22">1</tspan><tspan x="170" dy="22">0</tspan><tspan x="170" dy="22">0</tspan><tspan x="170" dy="22">1</tspan><tspan x="170" dy="22">1</tspan><tspan x="170" dy="22">0</tspan><tspan x="170" dy="22">#</tspan><tspan x="170" dy="22">1</tspan><tspan x="170" dy="22">0</tspan><tspan x="170" dy="22">1</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -300" to="0 60" dur="4.9s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
  <rect x="14" y="48" width="196" height="366" fill="url(#fade)"/>
  <rect x="14" y="48" width="196" height="366" rx="6" fill="none" stroke="#00FF41" stroke-opacity="0.18"/>

  <!-- neofetch info (right) -->
  <g font-size="16" filter="url(#glow)">
    <text x="236" y="78" fill="#00FF41" font-weight="bold">soji@github</text>
    <text x="236" y="98" fill="#008F11">────────────────────────────────────</text>

    <g fill="#9DFFB0">
      <text x="236" y="128"><tspan fill="#00FF41" font-weight="bold">role       </tspan>Principal DevOps Engineer
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.2s" fill="freeze"/></text>
      <text x="236" y="152"><tspan fill="#00FF41" font-weight="bold">field      </tspan>AI Infrastructure · Cloud Platform · MLOps
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.45s" fill="freeze"/></text>
      <text x="236" y="176"><tspan fill="#00FF41" font-weight="bold">experience </tspan>Ex-Solutions Architect @ AWS · FAANG
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.7s" fill="freeze"/></text>
      <text x="236" y="200"><tspan fill="#00FF41" font-weight="bold">clouds     </tspan>AWS · Azure · Google Cloud
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.95s" fill="freeze"/></text>
      <text x="236" y="224"><tspan fill="#00FF41" font-weight="bold">platform   </tspan>Kubernetes · EKS · Argo CD · Istio · MWAA
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.2s" fill="freeze"/></text>
      <text x="236" y="248"><tspan fill="#00FF41" font-weight="bold">mlops      </tspan>SageMaker · Bedrock · MLflow · Snowflake
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.45s" fill="freeze"/></text>
      <text x="236" y="272"><tspan fill="#00FF41" font-weight="bold">iac        </tspan>Terraform · Pulumi · CloudFormation
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.7s" fill="freeze"/></text>
      <text x="236" y="296"><tspan fill="#00FF41" font-weight="bold">security   </tspan>mTLS · OPA · Zero-Trust · DevSecOps
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.95s" fill="freeze"/></text>
      <text x="236" y="320"><tspan fill="#00FF41" font-weight="bold">certs      </tspan>NVIDIA AI Infra &amp; Ops · AWS SA/Dev/AI
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.2s" fill="freeze"/></text>
      <text x="236" y="344"><tspan fill="#00FF41" font-weight="bold">uptime     </tspan>production AI workloads @ 99.9%
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.45s" fill="freeze"/></text>
      <text x="236" y="368"><tspan fill="#00FF41" font-weight="bold">motto      </tspan>onboard a team with one YAML file
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.7s" fill="freeze"/></text>
    </g>

    <text x="236" y="400" fill="#00FF41" font-weight="bold">soji@github:~$ <tspan fill="#9DFFB0">deploy --prod</tspan></text>
    <rect x="462" y="388" width="10" height="16" fill="#00FF41">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
