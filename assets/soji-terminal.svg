<svg xmlns="http://www.w3.org/2000/svg" width="880" height="248" viewBox="0 0 880 248" font-family="'Courier New', ui-monospace, monospace">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rain"><rect x="14" y="48" width="196" height="182" rx="6"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0208" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#0D0208" stop-opacity="0"/>
      <stop offset="1" stop-color="#0D0208" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="878" height="246" rx="12" fill="#0D0208" stroke="#00FF41" stroke-opacity="0.55"/>
  <rect x="1" y="1" width="878" height="34" rx="12" fill="#06130A"/>
  <rect x="1" y="22" width="878" height="13" fill="#06130A"/>
  <circle cx="22" cy="18" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="18" r="6" fill="#FFBD2E"/>
  <circle cx="66" cy="18" r="6" fill="#27C93F"/>
  <text x="440" y="23" text-anchor="middle" fill="#00FF41" fill-opacity="0.7" font-size="13">soji@github: ~/profile</text>

  <!-- matrix rain (left) -->
  <g clip-path="url(#rain)" font-size="15" fill="#00FF41">
    <g opacity="0.85">
      <text x="26" y="0">1<tspan x="26" dy="22">0</tspan><tspan x="26" dy="22">1</tspan><tspan x="26" dy="22">1</tspan><tspan x="26" dy="22">0</tspan><tspan x="26" dy="22">#</tspan><tspan x="26" dy="22">1</tspan><tspan x="26" dy="22">0</tspan><tspan x="26" dy="22">0</tspan><tspan x="26" dy="22">1</tspan><tspan x="26" dy="22">$</tspan><tspan x="26" dy="22">0</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -120" to="0 200" dur="4.2s" repeatCount="indefinite"/>
      </text>
    </g>
    <g opacity="0.6">
      <text x="62" y="0">0<tspan x="62" dy="22">1</tspan><tspan x="62" dy="22">{</tspan><tspan x="62" dy="22">0</tspan><tspan x="62" dy="22">1</tspan><tspan x="62" dy="22">0</tspan><tspan x="62" dy="22">}</tspan><tspan x="62" dy="22">1</tspan><tspan x="62" dy="22">0</tspan><tspan x="62" dy="22">0</tspan><tspan x="62" dy="22">/</tspan><tspan x="62" dy="22">1</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -40" to="0 240" dur="5.6s" repeatCount="indefinite"/>
      </text>
    </g>
    <g opacity="0.75">
      <text x="98" y="0">1<tspan x="98" dy="22">1</tspan><tspan x="98" dy="22">0</tspan><tspan x="98" dy="22">&gt;</tspan><tspan x="98" dy="22">0</tspan><tspan x="98" dy="22">1</tspan><tspan x="98" dy="22">0</tspan><tspan x="98" dy="22">1</tspan><tspan x="98" dy="22">#</tspan><tspan x="98" dy="22">0</tspan><tspan x="98" dy="22">1</tspan><tspan x="98" dy="22">0</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -180" to="0 140" dur="3.6s" repeatCount="indefinite"/>
      </text>
    </g>
    <g opacity="0.5">
      <text x="134" y="0">0<tspan x="134" dy="22">0</tspan><tspan x="134" dy="22">1</tspan><tspan x="134" dy="22">0</tspan><tspan x="134" dy="22">$</tspan><tspan x="134" dy="22">1</tspan><tspan x="134" dy="22">0</tspan><tspan x="134" dy="22">1</tspan><tspan x="134" dy="22">1</tspan><tspan x="134" dy="22">0</tspan><tspan x="134" dy="22">*</tspan><tspan x="134" dy="22">1</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -80" to="0 240" dur="6.4s" repeatCount="indefinite"/>
      </text>
    </g>
    <g opacity="0.65">
      <text x="170" y="0">1<tspan x="170" dy="22">0</tspan><tspan x="170" dy="22">1</tspan><tspan x="170" dy="22">0</tspan><tspan x="170" dy="22">1</tspan><tspan x="170" dy="22">&lt;</tspan><tspan x="170" dy="22">0</tspan><tspan x="170" dy="22">1</tspan><tspan x="170" dy="22">0</tspan><tspan x="170" dy="22">0</tspan><tspan x="170" dy="22">1</tspan><tspan x="170" dy="22">1</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -200" to="0 120" dur="4.9s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
  <rect x="14" y="48" width="196" height="182" fill="url(#fade)"/>
  <rect x="14" y="48" width="196" height="182" rx="6" fill="none" stroke="#00FF41" stroke-opacity="0.18"/>

  <!-- neofetch info (right) -->
  <g font-size="16" filter="url(#glow)">
    <text x="238" y="80" fill="#00FF41" font-weight="bold">soji@github</text>
    <text x="238" y="100" fill="#008F11">────────────────────────────────────</text>

    <g fill="#9DFFB0">
      <text x="238" y="134"><tspan fill="#00FF41" font-weight="bold">role        </tspan>Principal DevOps Engineer
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/></text>
      <text x="238" y="162"><tspan fill="#00FF41" font-weight="bold">field       </tspan>AI Infrastructure · Cloud Platform · MLOps
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/></text>
      <text x="238" y="190"><tspan fill="#00FF41" font-weight="bold">experience  </tspan>Ex-Solutions Architect @ AWS · FAANG
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/></text>
    </g>

    <text x="238" y="222" fill="#00FF41" font-weight="bold">soji@github:~$ <tspan fill="#9DFFB0">deploy --prod</tspan></text>
    <rect x="516" y="210" width="10" height="16" fill="#00FF41">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
